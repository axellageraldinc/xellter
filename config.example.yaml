# xellter example configuration. Copy to xellter.yaml (git-ignored) or let the
# admin panel create and edit it. Almost everything has a working default, so a
# minimal file is fine. See docs/configuration.md.

server:
  listen: 127.0.0.1:8480          # put `tailscale serve` / a reverse proxy in front
  data_dir: data                  # SQLite, catalog cache, secrets, config history (relative to this file)
  admin_hosts: [localhost, 127.0.0.1, my-host.my-tailnet.ts.net]  # Host headers allowed to open /admin
  trusted_proxy: true             # honour X-Forwarded-For/Proto from the proxy in front

kenari:
  base_url: https://kenari.id
  # Optional full-access key of your kenari account. Put its value in data/secrets.env
  # (KENARI_ACCOUNT_KEY=kn-...) or paste it in the panel. It only reads plan, usage
  # and balance; it is never used to serve requests.
  account_key_env: KENARI_ACCOUNT_KEY

# A client is one app that calls xellter. It has its own kenari keys, and xellter
# generates its presets from the models those keys can call.
clients:
  - name: babu
    enabled: true
    key_hash: ""                  # sha256 of the xellter key; created by `xellter client add` or the panel
    keys:                         # kenari API keys of this client (values live in data/secrets.env)
      - name: main
        key_env: KENARI_KEY_BABU_MAIN
    presets: {}                   # filled automatically: text, image, video, tts, stt, music
    seeded: []                    # kinds that already got a generated preset
    daily_budget_idr: 0           # 0 = unlimited
    passthrough: []               # real model globs the app may also call directly, normally empty
    # You can also write presets by hand, for example a second text preset:
    # presets:
    #   coding:
    #     modality: chat
    #     mode: auto
    #     strategy: priority
    #     require: {tool_call: true}
    #     min_quality: 0.55
    #     weights: {cost: 20, benchmark: 35, reliability: 15, context: 10}

rules:
  free_bonus: 0.10
  plan_bonus: 0.08
  promo_bonus_max: 0.05
  sticky_minutes: 30

# Benchmark scores (0-100) override the leaderboard. Use numbers from a benchmark
# that matches your workload; leave empty to rely on the Arena leaderboard and the
# price-based estimate.
benchmarks: {}

rtk:
  enabled: true
