# xellter example configuration. Copy to xellter.yaml (git-ignored) or let the
# admin panel create and edit it. Almost everything has a working default, so a
# minimal file is fine. See docs/configuration.md.

server:
  listen: 127.0.0.1:8480          # put `tailscale serve` / a reverse proxy in front
  data_dir: data                  # SQLite, catalog cache, secrets, config history (relative to this file)
  admin_hosts: [localhost, 127.0.0.1, my-host.my-tailnet.ts.net]  # Host headers allowed to open the panel
  trusted_proxy: true             # honour X-Forwarded-For/Proto from the proxy in front

kenari:
  base_url: https://kenari.id
  # Optional full-access key of your kenari account. Put its value in data/secrets.env
  # (KENARI_ACCOUNT_KEY=kn-...) or paste it in the panel. It only reads plan, usage
  # and balance; it is never used to serve requests.
  account_key_env: KENARI_ACCOUNT_KEY

# Routing is the same for every client and preset. These are the only knobs left.
routing:
  rank_refresh_minutes: 5         # rankings are rebuilt on this interval, after a catalog sync, and by Recalculate
  top_models: 10                  # how many models a preset routes against
  evict_errors: 3                 # errors that take a model out of one preset
  evict_window_minutes: 60        # ... counted inside this window
  evict_cooldown_minutes: 720     # ... and the model is skipped for this long
  avoid_sunset_days: 3            # a model retiring sooner than this is not offered
  # Speed and reliability (ADR 0029). A model that is slow or fails too often goes out of the
  # preset that saw it, for a while, and is measured again when it comes back.
  first_token_timeout_s: 15       # a streamed chat answer silent this long (+1 s per 10k prompt tokens) moves to the next model; -1 = off
  slow_first_token_s: 10          # median wait for the first token above this takes a model out
  fail_percent: 40                # this share of failed requests takes a model out
  health_min_requests: 6          # requests inside the window before a model is judged
  quarantine_minutes: 30          # first time out; doubles each time it comes back and fails again (up to evict_cooldown_minutes)
  repin_first_token_s: 15         # a pinned model this slow for 2 of a session's last 3 requests loses the session

# A client is one app that calls xellter. It has its own kenari keys, one purpose
# that decides how its text preset is scored, and at most one preset per category.
clients:
  - name: demo
    enabled: true
    purpose: general              # general | coding | agentic | vision | bulk
    key_hash: ""                  # sha256 of the xellter key; created by `xellter client add` or the panel
    keys:                         # kenari API keys of this client (values live in data/secrets.env)
      - name: main
        key_env: KENARI_KEY_DEMO_MAIN
      # A key that serves one service instead of a model. `search` is the only capability:
      # it answers POST /v1/x/search, is never probed, never joins a pool and never serves
      # a model call, so a pay-as-you-go key is only spent on the calls the app asked for.
      # - name: X-search
      #   key_env: KENARI_KEY_DEMO_X_SEARCH
      #   capability: search
    presets:                      # one entry per category; the name is the model's name (ADR 0021)
      text:                       # chat   | image: images | video: videos
        category: chat            # tts: audio_speech | stt: audio_transcription
        optimization: balanced    # music: music | systemone: systemone
        models: []                # the pool, picked in the panel; the optimization only orders it
        sticky: true              # one model per session; false routes every turn again (ADR 0025)
    # A second preset of the same category is refused: a client holds one of each.
    # Every free and discounted model of the category is in the pool on its own (ADR 0022).
    # optimization: cheapest | balanced | best_quality
