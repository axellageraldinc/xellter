<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>xellter admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23206bc4'/%3E%3Cpath d='M8 9l16 14M24 9L8 23' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/tabler.min.css">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div class="page page-center" id="login" hidden>
  <div class="container container-tight py-4">
    <div class="text-center mb-4"><span class="brand-mark">xellter</span></div>
    <form class="card card-md" id="loginform" autocomplete="on">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Sign in</h2>
        <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" type="password" autocomplete="current-password" required></div>
        <div class="mb-3"><label class="form-label">Authenticator code (or a recovery code)</label><input class="form-control" name="code" inputmode="numeric" autocomplete="one-time-code" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
        <div id="loginerr" class="text-danger mt-3" role="alert"></div>
      </div>
    </form>
  </div>
</div>

<div class="page" id="app" hidden>
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
      <button class="navbar-toggler" id="burger" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
      <span class="navbar-brand brand-mark"><a href="#/overview">xellter</a></span>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav pt-lg-3" id="nav"></ul>
        <div class="mt-auto side-foot">
          <button class="btn btn-ghost-light btn-sm w-100 justify-content-start mb-1" id="theme"></button>
          <button class="btn btn-ghost-light btn-sm w-100 justify-content-start" id="logout"></button>
        </div>
      </div>
    </div>
  </aside>
  <div class="page-wrapper">
    <div class="page-header d-print-none"><div class="container-xl" id="head"></div></div>
    <div class="page-body"><div class="container-xl" id="view"></div></div>
  </div>
  <div id="savebar" class="savebar" hidden>
    <div class="container-xl d-flex align-items-center gap-2">
      <span class="me-auto fw-bold">Unsaved changes</span>
      <button class="btn btn-ghost-secondary" id="discard">Discard</button>
      <button class="btn btn-primary" id="save">Save &amp; apply</button>
    </div>
  </div>
</div>
<dialog id="dlg" class="card"><div class="card-body" id="dlgbody"></div></dialog>
<div id="toast" class="toast-lite" role="status"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
